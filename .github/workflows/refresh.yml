name: Update investor calendar
on:
  push:
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/update_events.py'
      - 'scripts/update_ir_notices.py'
      - 'scripts/update_coreweave.py'
  workflow_dispatch:
  schedule:
    - cron: '5 22,10 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh free FRED economic calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_events.py
      - name: Check official company IR RSS
        run: python scripts/update_ir_notices.py
      - name: Verify RSS JSON
        run: python -m json.tool data/ir_notices.json > /dev/null
      - name: Check CoreWeave official earnings announcement
        run: python scripts/update_coreweave.py
      - name: Verify JSON
        run: python -m json.tool data/events.json > /dev/null
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/ir_notices.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh economic calendar"
            git push
          fi
